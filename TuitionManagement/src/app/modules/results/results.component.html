<div class="results-container">
  <h1>Results Management</h1>
  
  <div class="results-actions">
    <button class="btn btn-primary">Add Result</button>
    <button class="btn btn-secondary">Upload Results</button>
    <button class="btn btn-secondary">View Reports</button>
  </div>
  
  <div class="results-table">
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Student Name</th>
          <th>Subject</th>
          <th>Marks</th>
          <th>Grade</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6" class="empty">No results found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
